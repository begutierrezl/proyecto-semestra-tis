services:
  webpage:
    container_name: react_client
    stdin_open: true
    build: 
      context: src/webpage
      dockerfile: Dockerfile
    ports:
     - 9000:9000
    volumes:
      - ./src/webpage:/client
    env_file:
      - .env
  
  backend:
    container_name: api_server
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    volumes:
      - ./src/backend:/server
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env
  
  db:
    container_name: postgres_db
    image: postgres:17
    ports:
     - 5432:5432
    volumes:
      - postgres_db:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
 postgres_db:

